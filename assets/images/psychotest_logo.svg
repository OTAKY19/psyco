<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle de fond -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" stroke="url(#gradient2)" stroke-width="4"/>
  
  <!-- Cerveau stylisé -->
  <path d="M60 80 C50 70, 50 60, 60 50 C70 40, 80 40, 90 50 C100 40, 110 40, 120 50 C130 60, 130 70, 120 80 C130 90, 130 100, 120 110 C130 120, 130 130, 120 140 C110 150, 100 150, 90 140 C80 150, 70 150, 60 140 C50 130, 50 120, 60 110 C50 100, 50 90, 60 80 Z" 
        fill="url(#gradient3)" stroke="url(#gradient4)" stroke-width="3"/>
  
  <!-- Ligne de séparation des hémisphères -->
  <path d="M100 50 L100 150" stroke="url(#gradient5)" stroke-width="2"/>
  
  <!-- Symbole plus dans l'hémisphère droit -->
  <g transform="translate(120, 100)">
    <rect x="-8" y="-2" width="16" height="4" fill="url(#gradient6)" rx="2"/>
    <rect x="-2" y="-8" width="4" height="16" fill="url(#gradient6)" rx="2"/>
  </g>
  
  <!-- Définitions des gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="gradient6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
