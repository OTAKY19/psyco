name: psychotest_plus
description: PsychoTest+ - Votre compagnon d'étude pour les tests psychotechniques.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter: # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE

  # CRITICAL: Core UI - DO NOT REMOVE OR MODIFY
  flutter_svg: ^2.0.9 # Required for SVG icon support
  google_fonts: ^6.1.0 # Required for typography (replaces local fonts)
  shared_preferences: 2.4.0 # Required for local data storage
  web: ^1.1.1
  provider: ^6.1.2
  intl: ^0.20.2
  go_router: ^14.8.1

  # Feature dependencies - safe to modify
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.69.0 # Version compatible avec Flutter 3.32.6
  table_calendar: ^3.2.0
  share_plus: ^11.1.0
  flutter_slidable: ^4.0.1
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  file_picker: ^10.3.2
  path_provider: ^2.1.5
  path: ^1.9.0
  shimmer: ^3.0.0 # Pour les animations de skeleton loading
  # vector_math: ^2.2.0  # SUPPRIMÉ - conflit avec Flutter SDK
  universal_html: ^2.2.4
  sqflite: ^2.3.0
  crypto: ^3.0.3
  supabase_flutter: ^2.15.4
dev_dependencies:
  flutter_test: # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^4.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE

  assets:
    - assets/images/
    - assets/data/

  # CRITICAL ASSET MANAGEMENT RULES:
  # - DO NOT ADD NEW ASSET DIRECTORIES (assets/svg/, assets/icons/, etc.)
  # - ONLY USE EXISTING AND ITEMS AVAILABLE IN THE DIRECTORIES LISTED ABOVE (assets/, assets/images/)

  # CRITICAL FONTS RULE:
  # - THIS PROJECT USES GOOGLE FONTS INSTEAD OF LOCAL FONTS
  # - DO NOT ADD ANY LOCAL FONTS SECTION OR FONT FILES
